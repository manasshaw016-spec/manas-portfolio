<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Futuristic Hexagon Background -->
  <rect width="64" height="64" rx="16" fill="#070b14" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#cyberGrad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Neural Network Connections -->
  <line x1="20" y1="20" x2="32" y2="32" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.7" />
  <line x1="20" y1="44" x2="32" y2="32" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="32" x2="44" y2="22" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="32" x2="44" y2="42" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7" />
  <line x1="20" y1="20" x2="20" y2="44" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />

  <!-- Neural Nodes -->
  <circle cx="20" cy="20" r="5" fill="#070b14" stroke="#00f2fe" stroke-width="2.5" />
  <circle cx="20" cy="44" r="5" fill="#070b14" stroke="#00f2fe" stroke-width="2.5" />
  <circle cx="32" cy="32" r="6" fill="#070b14" stroke="url(#cyberGrad)" stroke-width="3" />
  <circle cx="44" cy="22" r="5" fill="#070b14" stroke="#a855f7" stroke-width="2.5" />
  <circle cx="44" cy="42" r="5" fill="#070b14" stroke="#a855f7" stroke-width="2.5" />

  <!-- Center Core Glow -->
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8" />
</svg>